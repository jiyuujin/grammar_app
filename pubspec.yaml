      ref: main
  flutter_svg: ^1.0.3
  flutter_svg_provider: ^1.0.1
  intl: ^0.17.0
  state_notifier: ^0.7.2+1

dev_dependencies:
  build_runner:
  flutter_gen_runner:
  flutter_test:
    sdk: flutter
  pedantic_mono: ^1.15.0

flutter:
